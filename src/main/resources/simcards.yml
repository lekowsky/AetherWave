# ═══════════════════════════════════════════
# MCPhone - Konfiguracja kart SIM
# Typy kart SIM i punkty sprzedaży
# ═══════════════════════════════════════════

# Typy kart SIM
sim-types:
  basic:
    id: "basic"
    name: "&fKarta SIM - Podstawowa"
    description: "Podstawowa karta SIM z limitem SMS"
    material: "PAPER"
    custom-model-data: 10200
    color: "&f"
    price: 500
    daily-sms-limit: 50
    calls-enabled: false
    internet-enabled: false
    lore:
      - "&7Typ: &fPodstawowa"
      - "&7Limit SMS: &f50/dzień"
      - ""
      - "&8Kliknij prawym na telefon"
      - "&8aby aktywować"

  premium:
    id: "premium"
    name: "&6Karta SIM - Premium"
    description: "Rozszerzona karta SIM z większym limitem"
    material: "PAPER"
    custom-model-data: 10201
    color: "&6"
    price: 1500
    daily-sms-limit: 200
    calls-enabled: true
    internet-enabled: false
    lore:
      - "&7Typ: &6Premium"
      - "&7Limit SMS: &f200/dzień"
      - "&7Połączenia: &aTAK"
      - ""
      - "&8Kliknij prawym na telefon"
      - "&8aby aktywować"

  vip:
    id: "vip"
    name: "&5Karta SIM - VIP"
    description: "Karta SIM VIP bez limitów"
    material: "PAPER"
    custom-model-data: 10202
    color: "&5"
    price: 5000
    daily-sms-limit: -1
    calls-enabled: true
    internet-enabled: true
    lore:
      - "&7Typ: &5VIP"
      - "&7Limit SMS: &aBez limitu"
      - "&7Połączenia: &aTAK"
      - "&7Internet: &aTAK"
      - ""
      - "&8Kliknij prawym na telefon"
      - "&8aby aktywować"

# Punkty sprzedaży kart SIM
# Można dodawać przez komendę /phoneadmin simshop add
sim-shops: {}
