# ═══════════════════════════════════════════
# MCPhone - Wiadomości i teksty pluginu
# Wszystkie wiadomości są w pełni konfigurowalne
# Obsługiwane kolory: &0-&f, &l, &n, &o, &k, &m, &r
# Placeholdery: {player}, {number}, {message}, {sender}, {receiver}
# ═══════════════════════════════════════════

# Ogólne wiadomości
general:
  no-permission: "&cNie masz uprawnień do użycia tej komendy!"
  player-only: "&cTa komenda jest dostępna tylko dla graczy!"
  reload-success: "&aKonfiguracja została przeładowana!"
  invalid-args: "&cNieprawidłowe argumenty! Użyj: {usage}"
  player-not-found: "&cGracz {player} nie został znaleziony!"
  player-offline: "&eGracz {player} jest offline."

# Wiadomości telefonu
phone:
  received: "&aOtrzymałeś telefon! &7Kliknij prawym przyciskiem aby go otworzyć."
  already-has: "&cMasz już telefon w ekwipunku!"
  no-phone: "&cNie masz telefonu! Poproś administratora o jego przyznanie."
  opened: ""
  no-sim: "&cNie masz aktywnej karty SIM! Kup jedną w punkcie sprzedaży."

# Wiadomości SMS
sms:
  sent: "&7[&5SMS&7] &aDo &f{receiver}&a: &7{message}"
  received: "&7[&5SMS&7] &eOd &f{sender}&e: &7{message}"
  received-title: "&5✉ Nowy SMS"
  received-subtitle: "&7Od: &f{sender}"
  no-sim-required: "&cPotrzebujesz aktywnej karty SIM aby wysyłać SMS!"
  self-send: "&cNie możesz wysłać SMS do siebie!"
  cooldown: "&cMusisz poczekać {time}s przed wysłaniem kolejnego SMS!"
  too-long: "&cWiadomość jest za długa! Maksymalnie {max} znaków."
  number-not-found: "&cNie znaleziono gracza z numerem {number}!"

# Wiadomości kontaktów
contacts:
  added: "&aDodano kontakt &f{name} &a({number})!"
  removed: "&cUsunięto kontakt &f{name}&c!"
  edited: "&aEdytowano kontakt &f{name}&a!"
  already-exists: "&cKontakt z tym numerem już istnieje!"
  not-found: "&cNie znaleziono kontaktu!"
  list-empty: "&7Nie masz żadnych kontaktów."

# Wiadomości karty SIM
sim:
  activated: "&aKarta SIM została aktywowana! Twój numer: &f{number}"
  already-active: "&cMasz już aktywną kartę SIM!"
  purchased: "&aZakupiono kartę SIM typu &f{type}&a!"
  no-money: "&cNie masz wystarczająco pieniędzy! Potrzebujesz: &f{price}"
  deactivated: "&eKarta SIM została dezaktywowana."
  invalid-card: "&cNieprawidłowa karta SIM!"

# Wiadomości sklepu z aplikacjami
appstore:
  installed: "&aPomyślnie zainstalowano aplikację &f{app}&a!"
  uninstalled: "&cOdinstalowano aplikację &f{app}&c!"
  already-installed: "&eAplikacja &f{app} &ejest już zainstalowana!"
  not-installed: "&cAplikacja &f{app} &cnie jest zainstalowana!"
  purchased: "&aZakupiono aplikację &f{app} &aza &f{price}&a!"

# Wiadomości administracyjne
admin:
  give-phone: "&aPrzyznano telefon graczowi &f{player}&a!"
  give-sim: "&aPrzyznano kartę SIM (&f{type}&a) graczowi &f{player}&a!"
  set-number: "&aUstawiono numer &f{number} &agraczowi &f{player}&a!"
  remove-number: "&cUsunięto numer telefonu graczowi &f{player}&c!"
