# ═══════════════════════════════════════════
# MCPhone - Konfiguracja aplikacji
# Domyślne aplikacje oraz aplikacje w sklepie
# ═══════════════════════════════════════════

# Domyślne aplikacje (zawsze zainstalowane)
default-apps:
  contacts:
    id: "contacts"
    name: "&f☎ Kontakty"
    description: "Zarządzaj swoimi kontaktami telefonicznymi"
    material: "PLAYER_HEAD"
    custom-model-data: 10100
    position: 0
    category: "system"
    built-in: true
    lore:
      - "&7Zarządzaj swoimi kontaktami"
      - "&7Dodawaj, edytuj, usuwaj"
      - ""
      - "&eKliknij aby otworzyć"

  sms:
    id: "sms"
    name: "&f✉ Wiadomości"
    description: "Wysyłaj i odbieraj wiadomości SMS"
    material: "PAPER"
    custom-model-data: 10101
    position: 1
    category: "communication"
    built-in: true
    lore:
      - "&7Wysyłaj i odbieraj SMS"
      - "&7Historia konwersacji"
      - ""
      - "&eKliknij aby otworzyć"

  appstore:
    id: "appstore"
    name: "&f🛒 AppStore"
    description: "Sklep z aplikacjami do pobrania"
    material: "EMERALD"
    custom-model-data: 10102
    position: 2
    category: "system"
    built-in: true
    lore:
      - "&7Przeglądaj i pobieraj"
      - "&7nowe aplikacje"
      - ""
      - "&eKliknij aby otworzyć"

  settings:
    id: "settings"
    name: "&f⚙ Ustawienia"
    description: "Ustawienia telefonu i konta"
    material: "COMPARATOR"
    custom-model-data: 10103
    position: 3
    category: "system"
    built-in: true
    lore:
      - "&7Zarządzaj ustawieniami"
      - "&7swojego telefonu"
      - ""
      - "&eKliknij aby otworzyć"

# Aplikacje dostępne w sklepie (AppStore)
# Zewnętrzne pluginy mogą rejestrować swoje aplikacje przez API
# Te przykładowe aplikacje są puste - służą jako wzór
store-apps: {}

