# ═══════════════════════════════════════════
# MCPhone - Główna konfiguracja pluginu
# Wersja: 1.0.0
# Platforma: Purpur 1.21.10
# ═══════════════════════════════════════════

# Ustawienia ogólne pluginu
general:
  # Prefiks wiadomości pluginu
  prefix: "&7[&5MCPhone&7] "
  # Język pluginu (pl/en)
  language: "pl"
  # Czy włączyć tryb debugowania
  debug: false
  # Automatyczne zapisywanie danych (w sekundach)
  auto-save-interval: 300

# Ustawienia bazy danych
database:
  # Typ bazy danych: YAML lub MYSQL
  type: "YAML"
  # Ustawienia MySQL (tylko gdy type: MYSQL)
  mysql:
    host: "localhost"
    port: 3306
    database: "mcphone"
    username: "root"
    password: "password"
    # Prefiks tabel w bazie danych
    table-prefix: "mcphone_"
    # Pula połączeń
    pool-size: 10

# Ustawienia telefonu
phone:
  # Materiał przedmiotu telefonu
  material: "IRON_INGOT"
  # Custom Model Data dla przedmiotu telefonu
  custom-model-data: 10001
  # Nazwa przedmiotu telefonu
  display-name: "&5☎ &dTelefon"
  # Opis przedmiotu telefonu (lore)
  lore:
    - "&7Kliknij prawym przyciskiem"
    - "&7aby otworzyć telefon"
    - ""
    - "&8MCPhone v1.0.0"
  # Czy telefon jest nieniszczalny
  unbreakable: true
  # Czy telefon można wyrzucić
  droppable: false

# Format numerów telefonów
phone-number:
  # Format numeru (# = cyfra)
  format: "###-###-###"
  # Długość numeru (bez myślników)
  length: 9
  # Prefiks kraju
  country-prefix: "+48"

# Ustawienia powiadomień
notifications:
  # Dźwięk powiadomienia SMS
  sms-sound: "BLOCK_NOTE_BLOCK_BELL"
  # Głośność dźwięku (0.0 - 1.0)
  sms-sound-volume: 1.0
  # Wysokość dźwięku (0.0 - 2.0)
  sms-sound-pitch: 1.5
  # Czy pokazywać powiadomienia na chacie
  chat-notifications: true
  # Czy pokazywać tytuł/subtitle
  title-notifications: true
  # Czas wyświetlania tytułu (w tickach)
  title-fade-in: 10
  title-stay: 40
  title-fade-out: 10

# Ustawienia SMS
sms:
  # Maksymalna długość wiadomości SMS
  max-length: 256
  # Czy zapisywać historię wiadomości
  save-history: true
  # Maksymalna ilość wiadomości w historii (na konwersację)
  max-history: 100
  # Cooldown wysyłania SMS (w sekundach, 0 = brak)
  cooldown: 1
  # Czy wymagana aktywna karta SIM do wysyłania SMS
  require-sim: true

# Ustawienia sklepu z aplikacjami (AppStore)
appstore:
  # Czy włączyć sklep z aplikacjami
  enabled: true
  # Czy aplikacje mogą mieć ceny
  economy-enabled: false
  # Plugin ekonomii (Vault/PlayerPoints)
  economy-plugin: "Vault"

# Ustawienia punktów sprzedaży kart SIM
sim-shops:
  # Czy włączyć punkty sprzedaży
  enabled: true
  # Materiał NPC/bloku punktu sprzedaży
  shop-block: "LODESTONE"
  # Promień interakcji z punktem sprzedaży (w blokach)
  interaction-radius: 3
