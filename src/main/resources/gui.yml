    background:
      material: GRAY_STAINED_GLASS_PANE
      custom-model-data: 0
      display-name: " "

  navigation:
    left:
      slot: 48
      material: ARROW
      display-name: "&7◄ Poprzednia strona"
      lore: []
    home:
