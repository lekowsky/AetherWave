# ═══════════════════════════════════════════
# MCPhone - Konfiguracja GUI telefonu
# NOWE OPCJE: title-offset, title-format
# ═══════════════════════════════════════════

# Główne okno telefonu (pulpit)
phone-gui:
  # Tytuł okna (zwykły)
  title: "MCPhone"

  # Tytuł dla Nexo (custom font) - zostaw pusty jeśli nie używasz Nexo
  # Wpisz tutaj swój Unicode char tekstury telefonu
  # Przykład: "\uE001" gdzie \uE001 to Twoja tekstura
  nexo-title: ""

  # ═══════════════════════════════════════════
  # NOWE OPCJE - przesunięcie tekstury
  # ═══════════════════════════════════════════

  # Przesunięcie tytułu w pikselach
  # Ujemne = w lewo, Dodatnie = w prawo
  # Wymaga NegativeSpaceFont w resource packu!
  #
  # Przykłady:
  #   title-offset: -8    → 8 pikseli w lewo
  #   title-offset: -16   → 16 pikseli w lewo
  #   title-offset: 0     → bez przesunięcia
  #   title-offset: -168  → typowa wartość do wyśrodkowania
  #
  title-offset: 0

  # Format tytułu — jak plugin ma interpretować tytuł
  #
  # "raw"         — ZALECANY dla Nexo/custom font
  #                 Znaki Unicode przechodzą BEZ ZMIAN
  #
  # "minimessage" — obsługuje tagi MiniMessage
  #                 np: "<red>Telefon</red>"
  #
  # "legacy"      — stary format &a, &b, &#RRGGBB
  #                 (zachowany dla kompatybilności)
  #
  title-format: "raw"

  # Rozmiar GUI (ilość slotów)
  size: 54

  # Sloty ramki telefonu (wypełnienie - dekoracja)
  frame:
    material: "BLACK_STAINED_GLASS_PANE"
    custom-model-data: 10010
    display-name: " "
    slots: [0,1,2,6,7,8,9,10,11,15,16,17,18,19,20,24,25,26,27,28,29,33,34,35,36,37,38,42,43,44,45,46,47,51,52,53]

  # Sloty ekranu telefonu (tu wyświetlają się ikony aplikacji)
  screen:
    slots: [3,4,5,12,13,14,21,22,23,30,31,32,39,40,41]
    background:
      material: "GRAY_STAINED_GLASS_PANE"
      custom-model-data: 10011
      display-name: " "

  # Przyciski nawigacyjne na dole telefonu
  navigation:
    left:
      slot: 48
      material: "ARROW"
      custom-model-data: 10020
      display-name: "&7◄ Poprzednia strona"
      lore:
        - "&8Kliknij aby przejść"
        - "&8na poprzednią stronę"

    home:
      slot: 49
      material: "NETHER_STAR"
      custom-model-data: 10021
      display-name: "&f⌂ Pulpit"
      lore:
        - "&8Kliknij aby wrócić"
        - "&8na ekran główny"

    right:
      slot: 50
      material: "ARROW"
      custom-model-data: 10022
      display-name: "&7Następna strona ►"
      lore:
        - "&8Kliknij aby przejść"
        - "&8na następną stronę"

# GUI Kontaktów
contacts-gui:
  title: "☎ Kontakty"
  size: 54
  add-button:
