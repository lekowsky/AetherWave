# MCPhone - gui.yml
# NAPRAWIONA konfiguracja z obsługą MiniMessage shift
# Działa tak samo jak DeluxeMenus <shift:N>!

phone-gui:
  # Tytuł GUI z użyciem MiniMessage shift
  # Zmień -80 na odpowiednią wartość dla Twojej tekstury
  # Ujemne = w lewo, dodatnie = w prawo
  title: "<shift:-80><white>Mój Telefon</white>"

  # WAŻNE: musi być "minimessage" aby <shift:N> działał!
  title-format: "minimessage"

  # title-offset = 0 gdy używasz <shift:N> inline w title
  title-offset: 0

  # Jeśli używasz Nexo - wpisz tu MiniMessage title z shift:
  # nexo-title: "<shift:-80><white>Mój Telefon</white>"

  size: 54

  frame:
    material: BLACK_STAINED_GLASS_PANE
    custom-model-data: 0
    display-name: " "
    slots:
