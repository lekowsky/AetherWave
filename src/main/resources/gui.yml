    material: "LIME_DYE"
    custom-model-data: 10030
    display-name: "&a✚ Dodaj kontakt"
  back-button:
    slot: 45
    material: "BARRIER"
    display-name: "&c← Powrót"
  contact-icon:
    material: "PLAYER_HEAD"
    lore:
      - "&7Numer: &f{number}"
      - ""
      - "&eLKM &7- Wyślij SMS"
      - "&ePKM &7- Edytuj kontakt"
      - "&cSHIFT+PKM &7- Usuń kontakt"

